services:
  - type: web
    name: salesdam-api
    runtime: docker
    repo: https://github.com/SaphoM/Salesdam-v3
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /health
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        fromDatabase:
          name: salesdam-db
          property: connectionString
      - key: SESSION_MAX_AGE
        value: 86400000
    region: oregon

  - type: web
    name: salesdam-web
    runtime: static
    repo: https://github.com/SaphoM/Salesdam-v3
    plan: free
    autoDeployTrigger: commit
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    region: oregon

databases:
  - name: salesdam-db
    plan: free
    region: oregon
