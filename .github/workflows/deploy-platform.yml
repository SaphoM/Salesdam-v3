# Deploys /opt/salesdam-platform on Salesdam-V3-PRODUCTION when main is updated.
# Live domain: https://platform.salesdam.com
#
# Required repository secrets (same as Deploy test to VM):
#   DEPLOY_HOST      — e.g. 52.224.241.22
#   DEPLOY_USER      — e.g. azureuser
#   DEPLOY_SSH_KEY   — full private key PEM
#
# Syncs code via tarball from the Actions runner (VM has no GitHub credentials).

name: Deploy main to platform

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-platform
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "::error::Missing DEPLOY_HOST"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "::error::Missing DEPLOY_USER"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "::error::Missing DEPLOY_SSH_KEY"; exit 1; }

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pack release tarball
        run: |
          set -euo pipefail
          tar -czf /tmp/salesdam-platform-release.tar.gz \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./frontend/node_modules' \
            --exclude='./backend/node_modules' \
            --exclude='./admin/node_modules' \
            --exclude='./landing/node_modules' \
            --exclude='./backend/.env' \
            --exclude='./mongo-keyfile' \
            --exclude='./.mongo-creds' \
            .
          mv /tmp/salesdam-platform-release.tar.gz ./salesdam-platform-release.tar.gz
          ls -lh salesdam-platform-release.tar.gz

      - name: Upload tarball to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "salesdam-platform-release.tar.gz"
          target: "/tmp"
          overwrite: true

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            test -f /tmp/salesdam-platform-release.tar.gz
            cd /opt/salesdam-platform
            tar -xzf /tmp/salesdam-platform-release.tar.gz ./deploy-platform.sh
            chmod +x deploy-platform.sh
            export DEPLOY_BRANCH=main
            export APP_DIR=/opt/salesdam-platform
            export APP_URL=https://platform.salesdam.com
            export RELEASE_TARBALL=/tmp/salesdam-platform-release.tar.gz
            export DEPLOYED_SHA="${{ github.sha }}"
            ./deploy-platform.sh

      - name: Verify local platform stack
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            curl -fsS -o /dev/null -w "health=%{http_code}\n" http://127.0.0.1:5001/health
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5174/login || true)"
            echo "frontend_login=$code"
            test "$code" = "200"

      - name: Verify platform.salesdam.com
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            code="$(curl -s -o /dev/null -w '%{http_code}' https://platform.salesdam.com/login || true)"
            if [ "$code" = "200" ]; then
              echo "Smoke check passed (login=$code)"
              exit 0
            fi
            echo "Waiting for platform.salesdam.com (attempt $i, login=$code)..."
            sleep 10
          done
          echo "::warning::https://platform.salesdam.com/login did not return 200 yet (DNS or TLS may still be pending)"

      - name: Verify deployed commit marker
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/salesdam-platform
            expected="${{ github.sha }}"
            actual="$(tr -d '[:space:]' < .deployed-sha 2>/dev/null || true)"
            echo "Expected: $expected"
            echo "Deploy marker:"
            cat .deployed-sha 2>/dev/null || true
            echo "Deploy meta:"
            cat .deployed-meta 2>/dev/null || true
            echo "Git HEAD (may lag if tarball deploy): $(git rev-parse HEAD 2>/dev/null || echo n/a)"
            if [ -n "$actual" ] && [ "$actual" != "$expected" ]; then
              echo "::warning::Deploy marker mismatch (expected $expected, got $actual)"
            fi
